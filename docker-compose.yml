services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "${PORT:-8000}"
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    stop_grace_period: 40s
